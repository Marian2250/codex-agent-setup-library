# This library uses Node's built-in test runner and Python's standard library.
# The GitHub-hosted Ubuntu runner provides both; no packages are installed.
name: Library checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check tools/library.cjs
          node --check tools/demo.cjs
          node --check tests/library.test.cjs

      - name: Run library behavior tests
        run: node --test tests/library.test.cjs

      - name: Verify portable library
        run: python3 tools/verify.py

      - name: Verify starter and guide
        run: python3 tools/verify-starter.py
